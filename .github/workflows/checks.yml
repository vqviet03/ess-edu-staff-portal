name: Checks
on:
  pull_request:
    branches: [dev]
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_USE_MOCK: "false"
      NEXT_PUBLIC_API_BASE_URL: https://api.example.com/v1
      NEXT_PUBLIC_API_TIMEOUT_MS: "15000"
      NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --max-failures=2 --retries=0
      - name: Browser failure context
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in list(Path('test-results').glob('**/error-context.md'))[:4]:
              print(str(p))
              print(p.read_text()[:20000])
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
